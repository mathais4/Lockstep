name: ci
on: [push, pull_request]

jobs:
  build:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: lockstep
          POSTGRES_PASSWORD: lockstep
          POSTGRES_DB: lockstep
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U lockstep" --health-interval 2s --health-retries 30
    env:
      TEST_DATABASE_URL: jdbc:postgresql://localhost:5432/lockstep
      DATABASE_URL: jdbc:postgresql://localhost:5432/lockstep
      DB_USER: lockstep
      DB_PASSWORD: lockstep
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: maven
      - name: Unit, integration and concurrency tests
        run: mvn -B verify
      - name: Short load + crash test (fails the build if an invariant breaks)
        run: java -jar target/lockstep.jar loadtest --jobs 3000 --processes 1,2 --chaos-seconds 15 --rate 100 --kills 2 --out target/results.md
      - uses: actions/upload-artifact@v4
        with:
          name: load-test-results
          path: target/results.md
